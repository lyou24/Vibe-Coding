<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; padding: 0; height: 0; overflow: hidden; background: transparent; }
  </style>
</head>
<body>
  <script>
    const USER_ID_KEY = "ongeki_opi_last_user_id";
    const FILTER_SETTINGS_KEY = "ongeki_opi_filter_settings";

    function sendMessageToStreamlit(data) {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setComponentValue",
        value: data
      }, "*");
    }

    function setFrameHeight(height) {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setFrameHeight",
        height: height
      }, "*");
    }

    let lastSentUid = undefined;
    let lastSentFiltersRaw = undefined;

    window.addEventListener("message", function(event) {
      if (event.data && event.data.type === "streamlit:render") {
        setFrameHeight(0);
        const args = event.data.args || {};
        const saveUid = args.save_user_id;
        const saveFilters = args.save_filters;

        try {
          // 1. ユーザーIDの保存要求がある場合は localStorage に書き込み
          if (saveUid !== undefined && saveUid !== null && String(saveUid).trim() !== "") {
            const cleanUid = String(saveUid).trim();
            localStorage.setItem(USER_ID_KEY, cleanUid);
          }

          // 2. フィルター設定の保存要求がある場合は localStorage に書き込み
          if (saveFilters !== undefined && saveFilters !== null && typeof saveFilters === "object") {
            try {
              localStorage.setItem(FILTER_SETTINGS_KEY, JSON.stringify(saveFilters));
            } catch (e) {
              console.warn("Failed to serialize filter settings:", e);
            }
          }

          // 3. localStorage から現在保存されている値を取得
          const cachedUid = localStorage.getItem(USER_ID_KEY);
          const cachedFiltersRaw = localStorage.getItem(FILTER_SETTINGS_KEY);
          let cachedFilters = null;
          if (cachedFiltersRaw) {
            try {
              cachedFilters = JSON.parse(cachedFiltersRaw);
            } catch (e) {
              console.warn("Failed to parse filter settings:", e);
            }
          }

          // 4. 値に変化があった場合、または初回のみ Streamlit へ通知
          if (cachedUid !== lastSentUid || cachedFiltersRaw !== lastSentFiltersRaw) {
            lastSentUid = cachedUid;
            lastSentFiltersRaw = cachedFiltersRaw;
            sendMessageToStreamlit({
              user_id: cachedUid,
              filters: cachedFilters
            });
          }
        } catch (e) {
          console.warn("localStorage access warning:", e);
          if (lastSentUid === undefined) {
            lastSentUid = null;
            lastSentFiltersRaw = null;
            sendMessageToStreamlit({ user_id: null, filters: null });
          }
        }
      }
    });

    // コンポーネント準備完了の通知
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:componentReady",
      apiVersion: 1
    }, "*");
  </script>
</body>
</html>
